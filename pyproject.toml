[project]
name = "paas-python-app"
version = "0.1.0"
description = "Учебное приложение курса «Деплой на PaaS»"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "sentry-sdk>=2.75.0",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.107",
]

# Это приложение, а не пакет: устанавливать нечего.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

# Миграции Alembic лежат в alembic/versions. Адрес базы env.py берёт из DATABASE_URL.
[tool.alembic]
script_location = "%(here)s/alembic"

[tool.ruff.lint.isort]
# Каталог alembic/ с миграциями лежит в корне, и без явной настройки ruff
# в разных окружениях по-разному решает, свой это модуль или библиотека.
known-third-party = ["alembic"]
